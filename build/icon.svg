<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">ContextCue app icon</title>
  <desc id="description">A conversation bubble with a context sparkle on a vivid lime rounded square.</desc>
  <defs>
    <linearGradient id="surface" x1="174" y1="112" x2="850" y2="912" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DFFF78"/>
      <stop offset="0.52" stop-color="#C8FF3D"/>
      <stop offset="1" stop-color="#A8E319"/>
    </linearGradient>
    <linearGradient id="bubble" x1="310" y1="278" x2="714" y2="744" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2A2C25"/>
      <stop offset="1" stop-color="#11120F"/>
    </linearGradient>
    <linearGradient id="reply" x1="370" y1="410" x2="644" y2="614" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E3FF91"/>
      <stop offset="1" stop-color="#B7EF2D"/>
    </linearGradient>
    <filter id="surface-shadow" x="16" y="22" width="992" height="1000" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#283500" flood-opacity="0.22"/>
    </filter>
    <filter id="bubble-shadow" x="188" y="218" width="680" height="630" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#1C2500" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g filter="url(#surface-shadow)">
    <rect x="72" y="56" width="880" height="880" rx="218" fill="url(#surface)"/>
    <rect x="74" y="58" width="876" height="876" rx="216" fill="none" stroke="#668D00" stroke-opacity="0.2" stroke-width="4"/>
  </g>

  <g filter="url(#bubble-shadow)">
    <rect x="232" y="184" width="530" height="510" rx="130" fill="url(#bubble)"/>
    <path d="M292 615h206L342 798c-20 16-50 2-50-24V615Z" fill="url(#bubble)"/>
  </g>

  <path d="M310 291c0-31 25-56 56-56h172" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-opacity="0.12" stroke-width="18"/>

  <g fill="none" stroke="url(#reply)" stroke-linecap="round" stroke-linejoin="round" stroke-width="54">
    <path d="M384 425h198c36 0 65 29 65 65s-29 65-65 65H410"/>
    <path d="M445 362l-63 63 63 63"/>
  </g>

  <g fill="#FFFFFF">
    <path d="M742 182c5-14 25-14 30 0l14 39c2 5 6 9 11 11l39 14c14 5 14 25 0 30l-39 14c-5 2-9 6-11 11l-14 39c-5 14-25 14-30 0l-14-39c-2-5-6-9-11-11l-39-14c-14-5-14-25 0-30l39-14c5-2 9-6 11-11l14-39Z"/>
    <circle cx="838" cy="374" r="19" opacity="0.78"/>
  </g>
</svg>
