name: Release macOS

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify stable tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ ! "${package_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "${GITHUB_REF_NAME}" != "v${package_version}" ]]; then
            echo "This workflow requires a stable v<package-version> tag."
            exit 1
          fi

      - name: Run checks and build
        run: |
          npm run lint
          npm test
          npm run build

      - name: Package ad-hoc signed beta builds with in-app installer downloads
        if: vars.MACOS_SIGNING_ENABLED != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never \
            -c.mac.identity=- -c.mac.hardenedRuntime=false \
            -c.mac.preAutoEntitlements=false -c.mac.notarize=false \
            -c.extraMetadata.contextcueMacAutoUpdate=false

      - name: Sign and notarize builds with automatic installation
        if: vars.MACOS_SIGNING_ENABLED == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for required in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required signing secret: ${required}"
              exit 1
            fi
          done
          npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish never \
            -c.forceCodeSigning=true -c.mac.hardenedRuntime=true -c.mac.notarize=true \
            -c.extraMetadata.contextcueMacAutoUpdate=true

      - name: Verify packaged update configuration
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: node scripts/verify-macos-update-config.mjs

      - name: Verify signatures inside downloadable DMG and ZIP
        env:
          BUILD_ARCH: ${{ matrix.arch }}
          SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: node scripts/verify-macos-artifacts.mjs

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contextcue-macos-${{ matrix.arch }}
          path: |
            dist/ContextCue-*.dmg
            dist/ContextCue-*.zip
            dist/ContextCue-*.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Download architecture artifacts separately
        uses: actions/download-artifact@v4
        with:
          pattern: contextcue-macos-*
          path: release-input

      - name: Merge and verify update metadata
        run: node scripts/prepare-macos-release.mjs release-input release-assets "${GITHUB_REF_NAME#v}"

      - name: Publish complete release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_ENABLED: ${{ vars.MACOS_SIGNING_ENABLED }}
        run: |
          if [[ "${SIGNING_ENABLED}" == "true" ]]; then
            echo "Signed and notarized macOS build. Future updates can be installed from Settings → App updates." > release-notes.md
          else
            echo "Ad-hoc signed early-access macOS build; not Apple notarized. On first launch, macOS may require System Settings → Privacy & Security → Open Anyway. If that option is unavailable, use a Developer ID signed and notarized release. Settings → App updates downloads the installer; quit ContextCue and replace it in Applications to finish updating." > release-notes.md
          fi
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            release-assets/* --verify-tag --draft \
            --title "ContextCue ${GITHUB_REF_NAME} — macOS" \
            --notes-file release-notes.md --generate-notes
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
